<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <link rel="icon" type="image/png" href="assets/images/emberwood-logo.png">

<body class="page-contact">
    <header><a class="logo" href="index.html" aria-label="Emberwood Interior Design home"><img
                src="assets/images/emberwood-logo.png" alt="Emberwood Interior Design"></a><button class="burger"
            aria-label="Menu">☰</button>
        <nav><a href="index.html" class="">Home</a><a href="products.html" class="">Collection</a><a
                href="showroom.html" class="">3D Showroom</a><a href="about.html" class="">About</a><a

    <section class="wrap">
        <h2>Contact us</h2>
        <form onsubmit="event.preventDefault();this.innerHTML='<p>Thanks! We will reply within one working day.</p>'">
            <input required placeholder="Your name"><input required type="email" placeholder="Email"><select>
                <option>Sofas</option>
                <option>Chairs</option>
                <option>Tables</option>
                <option>Beds</option>
            </select><textarea rows="5" placeholder="Message"></textarea><button class="btn">Send message</button>
        </form>
    </section>
    <footer>© 2026 Emberwood Furniture · Handmade in walnut, oak and mahogany</footer>
    <script src="js/data.js"></script>
